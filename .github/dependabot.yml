# Weekly, grouped updates. `cooldown` waits a few days after a release before proposing it — most malicious or broken
# releases are yanked within that window. Security updates are not delayed by cooldown.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
    commit-message: { prefix: ci }

  - package-ecosystem: npm # pnpm workspaces (root lockfile)
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5, semver-major-days: 14 }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: build }

  - package-ecosystem: nuget # central package management in Directory.Packages.props
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5, semver-major-days: 14 }
    groups:
      nuget-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: build }

  - package-ecosystem: uv
    directory: /services/ai-platform
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 5, semver-major-days: 14 }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: build }

  - package-ecosystem: docker # base-image digests
    directories: [/services/api, /db/migrations]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build }

  - package-ecosystem: docker-compose # local dev stack images
    directory: /infra/compose
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      dev-stack: { patterns: ['*'] }
    commit-message: { prefix: build }
