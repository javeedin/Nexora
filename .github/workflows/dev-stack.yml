# Proves `make up` works on a clean machine (P0-T03 "Done when") and catches upstream image drift weekly.
# Not a required check: it pulls ~5 GB of images, so it runs only when the stack changes.
name: Dev stack

on:
  pull_request:
    paths:
      - infra/compose/**
      - scripts/dev-*.mjs
      - Makefile
      - .github/workflows/dev-stack.yml
  schedule:
    - cron: '41 4 * * 1' # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-and-smoke:
    name: make up + smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make up
      - run: make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose/compose.yaml --env-file infra/compose/.env logs --tail 200
      - if: always()
        run: make reset
