# Build, test and lint every workspace (TS, .NET, Python) through Turborepo, build + scan container images.
# Branch protection requires only the `CI ok` job: it fails when any job above it failed or was cancelled.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  TRIVY_VERSION: v0.75.0

jobs:
  build-test:
    name: Build · test · lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # turbo --affected and commitlint need the base commit
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x # ADR 0003 — test on the runtime we ship
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - run: pnpm install --frozen-lockfile

      - name: Commit messages (Conventional Commits + requirement / task ID)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          # Squash merges use the PR title as the commit message, so it must pass too.
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Affected workspaces (pull request)
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm turbo run build test lint typecheck --affected --continue

      - name: All workspaces (main, merge queue, manual)
        if: github.event_name != 'pull_request'
        run: pnpm turbo run build test lint typecheck --continue

      - name: Root lint (ESLint + Prettier)
        run: pnpm lint:root

      - name: Repo hygiene (pre-commit; language linters already ran above)
        env:
          SKIP: prettier,eslint,dotnet-format,ruff,ruff-format
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # SARIF upload
    strategy:
      fail-fast: false
      matrix:
        service: [api] # add a service here when it gets a Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: nexora-${{ matrix.service }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy — image vulnerabilities (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: nexora-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
      - name: Trivy — image SARIF (code scanning)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: nexora-${{ matrix.service }}:${{ github.sha }}
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-image.sarif
      - if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: nexora-${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90

  ci-ok:
    name: CI ok
    if: always()
    needs: [build-test, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
